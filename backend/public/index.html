<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Todo Application</h1>
        
        <div id="authSection">
            <div class="tabs">
                <button id="showLoginBtn" class="active">Login</button>
                <button id="showSignupBtn">Signup</button>
            </div>
            
            <form id="loginForm">
                <h2>Login</h2>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <form id="signupForm" style="display: none;">
                <h2>Signup</h2>
                <input type="text" id="signupName" placeholder="Username" required>
                <input type="email" id="signupEmail" placeholder="Email" required>
                <input type="password" id="signupPassword" placeholder="Password" required>
                <button type="submit">Create Account</button>
            </form>
        </div>

        <div id="todoSection" style="display: none;">
            <div class="header">
                <h2>Welcome, <span id="userNameDisplay"></span></h2>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
            
            <form id="todoForm">
                <input type="text" id="title" placeholder="What needs to be done?" required>
                <button type="submit">Add Todo</button>
            </form>
            <div id="todosList"></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
